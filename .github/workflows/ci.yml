name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    timeout-minutes: 45
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git nodejs npm rust \
            webkit2gtk-4.1 gtk3 libayatana-appindicator

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the pinned libalpm soname
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(tr -d '[:space:]' < packaging/libalpm-soname)"
          current="$(pacman -Qi pacman \
            | awk -F': ' '/^Provides/ {print $2}' \
            | tr ' ' '\n' \
            | sed -n 's/^libalpm\.so=\([0-9][0-9]*\)-64$/\1/p' \
            | head -n 1)"
          echo "pinned libalpm.so=${pinned}; build container provides libalpm.so=${current}"
          if [[ -z "${current}" || "${pinned}" != "${current}" ]]; then
            echo "libalpm ABI changed. Update packaging/libalpm-soname and rebuild; see packaging/README.md." >&2
            exit 1
          fi

      - name: Build frontend
        run: |
          npm ci --prefix src-ui
          npm run build --prefix src-ui

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Frontend tests
        run: npm test --prefix src-ui
